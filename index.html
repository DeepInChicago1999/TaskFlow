<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#111113;--bg1:#18181b;--bg2:#1f1f23;--bg3:#27272c;--bg4:#2e2e35;
  --border:#38383f;--border2:#45454e;
  --text0:#e8e8ea;--text1:#b0b0b8;--text2:#78787f;--text3:#4a4a52;
  --accent:#5a7fff;--accent2:#3d5de8;
  --red:#e05252;--green:#4caf7a;--amber:#d4954a;
  --radius:8px;--sidebar:240px;
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg0);color:var(--text0);height:100vh;display:flex;overflow:hidden;font-size:14px}

/* SIDEBAR */
#sidebar{width:var(--sidebar);background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.logo{font-size:15px;font-weight:600;color:var(--text0);letter-spacing:-.3px}
.logo span{color:var(--accent)}
#sidebar-tree{flex:1;overflow-y:auto;padding:8px 0}
.tree-item{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;color:var(--text1);transition:background .12s;position:relative;user-select:none}
.tree-item:hover{background:var(--bg2);color:var(--text0)}
.tree-item.active{background:var(--bg3);color:var(--text0)}
.tree-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.tree-item .ti-icon{font-size:10px;opacity:.5;width:12px;text-align:center;flex-shrink:0}
.tree-item .ti-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-item .ti-count{font-size:11px;color:var(--text2);background:var(--bg4);padding:2px 6px;border-radius:10px;flex-shrink:0}
.tree-item.i1{padding-left:24px}
.tree-item.i2{padding-left:36px}
.ti-chev{font-size:9px;opacity:.4;transition:transform .15s;flex-shrink:0}
.ti-chev.open{transform:rotate(90deg)}
.sidebar-section{padding:8px 10px 3px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:8px}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ACTION BAR */
#action-bar{display:none;background:var(--bg1);border-bottom:1px solid var(--border);padding:8px 20px;flex-shrink:0;align-items:center;gap:8px}
#action-bar.show{display:flex}
.ab-info{flex:1;font-size:13px;color:var(--text2)}
.ab-info b{color:var(--text0);font-weight:500}

/* TOPBAR */
#topbar{height:50px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
#breadcrumb{flex:1;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);min-width:0;overflow:hidden}
.bc-part{cursor:pointer;transition:color .12s;white-space:nowrap}
.bc-part:hover{color:var(--text0)}
.bc-part.last{color:var(--text0);font-weight:500}
.bc-sep{opacity:.35;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text0);cursor:pointer;font-size:13px;font-family:inherit;transition:background .12s}
.btn:hover{background:var(--bg4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{border-color:#6b2929;color:var(--red)}
.btn.danger:hover{background:rgba(224,82,82,.1)}
.btn.sm{padding:4px 10px;font-size:12px}
.ico-btn{padding:3px 7px;border-radius:4px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-family:inherit;line-height:1;transition:background .1s,color .1s}
.ico-btn:hover{background:var(--bg4);color:var(--text0)}
.ico-btn.del:hover{background:rgba(224,82,82,.15);color:var(--red)}

/* HOME */
.view-title{font-size:20px;font-weight:600;margin-bottom:20px;color:var(--text0)}
.folder-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
.folder-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;transition:background .12s;user-select:none}
.folder-hd:hover{background:var(--bg3)}
.fchev{font-size:10px;color:var(--text2);transition:transform .15s;flex-shrink:0}
.fchev.open{transform:rotate(90deg)}
.fname{flex:1;font-weight:500;font-size:14px}
.fcnt{font-size:11px;color:var(--text2);background:var(--bg4);padding:2px 7px;border-radius:10px;flex-shrink:0}
.fbtns{display:flex;gap:2px;opacity:0;transition:opacity .12s;flex-shrink:0}
.folder-hd:hover .fbtns{opacity:1}
.folder-body{padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border)}
.topic-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;transition:background .12s,border-color .12s}
.topic-row:hover{background:var(--bg4);border-color:var(--border2)}
.topic-row.sel{border-color:var(--accent);background:rgba(90,127,255,.08)}
.tr-name{flex:1;font-size:13px;font-weight:500;color:var(--text0);cursor:pointer}
.tr-cnt{font-size:11px;color:var(--text2);flex-shrink:0}
.tr-acts{display:flex;gap:1px;opacity:0;transition:opacity .12s;flex-shrink:0}
.topic-row:hover .tr-acts{opacity:1}
.tr-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,background .12s}
.topic-row.sel .tr-circle{border-color:var(--accent);background:var(--accent)}
.topic-row.sel .tr-circle::after{content:'✓';font-size:9px;color:#fff}
.add-inline{display:none;align-items:center;gap:6px;padding:4px 0;margin-top:2px}
.add-inline.show{display:flex}
.add-inline input{flex:1;background:var(--bg3);border:1px solid var(--accent);border-radius:6px;padding:6px 10px;color:var(--text0);font-size:13px;font-family:inherit;outline:none}
.add-inline input::placeholder{color:var(--text3)}
.add-row-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:6px;border:1px dashed var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;transition:border-color .12s,color .12s;width:100%}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent)}
.ungrouped-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}

/* TOPIC VIEW */
#topic-view{display:none}
.topic-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.topic-hd-right{display:flex;gap:6px;flex-shrink:0}
.subtopics-wrap{display:flex;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);min-height:420px}
.sub-col{min-width:220px;max-width:280px;flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.sub-col:last-child{border-right:none}
.sub-hd{display:flex;align-items:center;gap:4px;padding:9px 10px;background:var(--bg3);border-bottom:1px solid var(--border);flex-shrink:0}
.sub-hd-name{flex:1;font-size:13px;font-weight:500;color:var(--text0);cursor:pointer;padding:3px 5px;border-radius:4px;transition:background .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-hd-name:hover{background:var(--bg4)}
input.sub-hd-name{cursor:text;background:var(--bg4);border:1px solid var(--accent);outline:none}
.sub-hd-acts{display:flex;gap:1px;opacity:0;transition:opacity .12s;flex-shrink:0}
.sub-hd:hover .sub-hd-acts{opacity:1}
.tasks-list{flex:1;overflow-y:auto;padding:8px}
.task-card{display:flex;align-items:flex-start;gap:8px;padding:8px 9px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:background .12s,border-color .12s;margin-bottom:5px}
.task-card:hover{background:var(--bg4);border-color:var(--border2)}
.task-card.active-detail{border-color:var(--accent);background:rgba(90,127,255,.07)}
.task-chk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;cursor:pointer;transition:border-color .12s,background .12s}
.task-card.done .task-chk{border-color:var(--green);background:var(--green)}
.task-card.done .task-nm{text-decoration:line-through;color:var(--text2)}
.task-inf{flex:1;min-width:0}
.task-nm{font-size:13px;color:var(--text0);word-break:break-word}
.task-dl{font-size:11px;color:var(--text2);margin-top:3px}
.task-dl.ov{color:var(--red)}
.task-st-progress{display:flex;align-items:center;gap:5px;margin-top:4px}
.task-st-bar{flex:1;height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;max-width:56px}
.task-st-bar-fill{height:100%;background:var(--green);border-radius:2px;transition:width .25s}
.task-st-label{font-size:11px;color:var(--text2)}
.add-task-row{margin:3px 8px 8px;display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:6px;border:1px dashed var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;transition:border-color .12s,color .12s}
.add-task-row:hover{border-color:var(--accent);color:var(--accent)}
.add-sub-col{min-width:140px;display:flex;align-items:center;justify-content:center;padding:16px 12px;border-left:1px dashed var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;border-top:none;border-right:none;border-bottom:none;transition:color .12s,background .12s;flex-shrink:0}
.add-sub-col:hover{color:var(--accent);background:rgba(90,127,255,.05)}

/* DEADLINE VIEW */
#deadline-view{display:none}
.deadline-task-card{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;transition:background .12s,border-color .12s;cursor:pointer}
.deadline-task-card:hover{background:var(--bg3);border-color:var(--border2)}
.deadline-task-card.active-detail{border-color:var(--accent);background:rgba(90,127,255,.07)}
.dtc-main{flex:1;min-width:0}
.dtc-name{font-size:14px;font-weight:500;color:var(--text0);margin-bottom:4px}
.dtc-path{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.dtc-date{font-size:11px;color:var(--text2);flex-shrink:0;padding:3px 8px;background:var(--bg3);border-radius:4px}
.dtc-date.ov{background:rgba(224,82,82,.15);color:var(--red)}
.dtc-date.soon{background:rgba(212,149,74,.12);color:var(--amber)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:.3}
.empty-state-text{font-size:14px}

/* MODAL */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center}
#modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px;min-width:360px;max-width:480px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:18px}
.modal label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;margin-top:14px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal textarea,.modal select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:8px 11px;color:var(--text0);font-size:13px;font-family:inherit;outline:none;transition:border-color .12s}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent)}
.modal textarea{height:80px;resize:vertical}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* CONFIRM */
#confirm-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center}
#confirm-bg.show{display:flex}
.confirm-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px;min-width:300px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.confirm-title{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text0)}
.confirm-msg{font-size:13px;color:var(--text1);line-height:1.6}
.confirm-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* CONTEXT MENU */
#ctx-menu{display:none;position:fixed;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:4px;z-index:300;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#ctx-menu.show{display:block}
.ctx-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--text0);transition:background .1s}
.ctx-item:hover{background:var(--bg3)}
.ctx-item.red{color:var(--red)}
.ctx-item.red:hover{background:rgba(224,82,82,.1)}
.ctx-sep{height:1px;background:var(--border);margin:3px 4px}

/* DETAIL PANEL */
#detail-panel{display:none;position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--bg1);border-left:1px solid var(--border);z-index:50;flex-direction:column}
#detail-panel.show{display:flex}
.dp-topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.dp-topbar-title{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.dp-close{cursor:pointer;color:var(--text2);font-size:17px;padding:2px 6px;border-radius:4px;transition:color .12s,background .12s}
.dp-close:hover{color:var(--text0);background:var(--bg3)}
#dp-scroll{flex:1;overflow-y:auto;padding:18px 16px 24px}
.dp-path{font-size:12px;color:var(--text2);display:flex;align-items:center;flex-wrap:wrap;gap:3px;line-height:1.6;margin-bottom:5px}
.dp-title{font-size:17px;font-weight:600;color:var(--text0);line-height:1.35;margin-bottom:2px}
.dp-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:16px;margin-bottom:5px}
.dp-val{font-size:13px;color:var(--text0)}
.dp-desc{font-size:13px;color:var(--text1);line-height:1.65;background:var(--bg2);border-radius:6px;padding:9px 11px;border:1px solid var(--border)}
.dp-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:500}
.dp-badge.ov{background:rgba(224,82,82,.15);color:var(--red)}
.dp-badge.ok{background:rgba(76,175,122,.12);color:var(--green)}
.dp-badge.soon{background:rgba(212,149,74,.12);color:var(--amber)}
.dp-actions{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* ── SUBTASKS ── */
.st-section{margin-top:18px}
.st-section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.st-section-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.st-section-cnt{font-size:11px;color:var(--text2)}
.st-progbar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:10px;position:relative}
.st-progbar-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s ease}
.st-list{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}

/* subtask row */
.st-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  background:var(--bg2);border:1px solid var(--border);border-radius:7px;
  transition:background .1s,border-color .1s,opacity .15s;
  position:relative;
}
.st-row:hover{background:var(--bg3);border-color:var(--border2)}
.st-row.done .st-name{text-decoration:line-through;color:var(--text2)}
.st-row.editing{border-color:var(--accent);background:var(--bg3)}

/* drag handle */
.st-drag{
  color:var(--text3);cursor:grab;font-size:12px;flex-shrink:0;
  padding:0 2px;opacity:0;transition:opacity .1s;
  user-select:none;line-height:1;
}
.st-row:hover .st-drag{opacity:1}
.st-row.dragging{opacity:.4;border-style:dashed}
.st-drop-target{border-color:var(--accent)!important;background:rgba(90,127,255,.08)!important}

/* checkbox */
.st-chk{
  width:16px;height:16px;border-radius:4px;
  border:1.5px solid var(--border2);flex-shrink:0;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s;
  font-size:10px;color:transparent;
}
.st-row.done .st-chk{border-color:var(--green);background:var(--green);color:#fff}
.st-chk:hover{border-color:var(--green)}

/* name */
.st-name{
  flex:1;font-size:13px;color:var(--text0);
  min-width:0;word-break:break-word;line-height:1.4;
}

/* inline edit input */
.st-edit-inp{
  flex:1;background:transparent;border:none;
  color:var(--text0);font-size:13px;font-family:inherit;
  outline:none;min-width:0;line-height:1.4;
  padding:0;
}
.st-edit-inp::placeholder{color:var(--text3)}

/* action buttons */
.st-acts{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .1s}
.st-row:hover .st-acts,
.st-row.editing .st-acts{opacity:1}

/* add subtask area */
.st-add-area{margin-top:2px}
.add-st-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;border-radius:6px;
  border:1px dashed var(--border2);background:transparent;
  color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;
  transition:border-color .12s,color .12s;width:100%;
}
.add-st-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-st-row{
  display:none;align-items:center;gap:8px;
  padding:8px 10px;
  background:var(--bg2);border:1px solid var(--accent);border-radius:7px;
}
.add-st-row.show{display:flex}
.add-st-row input{
  flex:1;background:transparent;border:none;
  color:var(--text0);font-size:13px;font-family:inherit;
  outline:none;
}
.add-st-row input::placeholder{color:var(--text3)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header"><div class="logo">Task<span>Flow</span></div></div>
  <div id="sidebar-tree"></div>
</div>

<div id="main">
  <div id="action-bar">
    <div class="ab-info">Выбрано: <b id="sel-count">0</b></div>
    <button class="btn sm" id="ab-rename-btn" onclick="actionBarRename()">✎ Переименовать</button>
    <button class="btn sm danger" onclick="actionBarDelete()">✕ Удалить</button>
    <button class="btn sm" onclick="clearSel()">Отмена</button>
  </div>
  <div id="topbar">
    <div id="breadcrumb"></div>
    <button class="btn primary sm" id="tb-add-topic" onclick="startAddTopic()" style="display:none">+ Тема</button>
    <button class="btn sm" id="tb-add-folder" onclick="startAddFolder()" style="display:none">+ Папка</button>
    <button class="btn primary sm" id="tb-add-deadline-task" onclick="startAddDeadlineTask()" style="display:none">+ Задача</button>
  </div>
  <div id="content">
    <div id="home-view">
      <div class="view-title">Все темы</div>
      <div id="folders-list"></div>
      <div id="ungrouped-list"></div>
    </div>
    <div id="topic-view">
      <div class="topic-hd">
        <div class="view-title" id="tv-title" style="margin-bottom:0"></div>
        <div class="topic-hd-right">
          <button class="btn sm" onclick="renameCurTopic()">✎ Переименовать</button>
          <button class="btn sm danger" onclick="deleteCurTopic()">✕ Удалить тему</button>
        </div>
      </div>
      <div class="subtopics-wrap" id="subtopics-wrap"></div>
    </div>
    <div id="deadline-view">
      <div class="view-title" id="dv-title"></div>
      <div id="deadline-tasks-list"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-bg">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn primary" onclick="confirmModal()">Сохранить</button>
    </div>

// ── Supabase config ────────────────────────────────
const SB_URL = 'https://yonqtabrchxilvleoupy.supabase.co/rest/v1';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvbnF0YWJyY2h4aWx2bGVvdXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMjk0NjcsImV4cCI6MjA5MjcwNTQ2N30.JhmBCV1ASd5ABDisMDQV8ZqCd0cFKvORnyxWv_Holo4';
const SB_HEADERS = { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
const SB_ROW_KEY = 'default';
let sbSaveTimer = null;
let sbLastKnownUpdatedAt = null; // timestamp of the state we last loaded/saved
const SB_POLL_INTERVAL = 25000;  // проверять обновления каждые 25 сек

async function sbLoad() {
  showToast('⏳ Загрузка данных...', 3000);
  try {
    const r = await fetch(`${SB_URL}/taskflow_state?key=eq.${SB_ROW_KEY}&select=data,updated_at`, {
      headers: { ...SB_HEADERS, 'Accept': 'application/json' }
    });
    if (!r.ok) {
      const err = await r.json().catch(()=>({}));
      if (r.status === 404 || (err.code && err.code === '42P01')) {
        await sbCreateTable();
        render(); return;
      }
      throw new Error(err.message || r.statusText);
    }
    const rows = await r.json();
    if (rows && rows.length > 0 && rows[0].data) {
      const loaded = rows[0].data;
      S.folders = loaded.folders || [];
      S.topics  = loaded.topics  || [];
      sbLastKnownUpdatedAt = rows[0].updated_at || null;
      showToast('✓ Данные загружены');
    } else {
      showToast('✓ Новое хранилище готово');
    }
    _sbInitialized = true;
    render();
    sbStartPolling();
  } catch(e) {
    console.error('sbLoad error:', e);
    showToast('⚠ Ошибка загрузки: ' + e.message, 4000);
    _sbInitialized = true;
    render();
    sbStartPolling();
  }
}

// Периодически проверяем, не обновил ли другой девайс данные в БД
let sbPollTimer = null;
function sbStartPolling() {
  if (sbPollTimer) return;
  sbPollTimer = setInterval(sbPollForUpdates, SB_POLL_INTERVAL);
}

async function sbPollForUpdates() {
  if (sbSaveTimer !== null) return; // есть несохранённые изменения
  try {
    const r = await fetch(`${SB_URL}/taskflow_state?key=eq.${SB_ROW_KEY}&select=updated_at`, {
      headers: { ...SB_HEADERS, 'Accept': 'application/json' }
    });
    if (!r.ok) return;
    const rows = await r.json();
    if (!rows || !rows.length) return;
    const remoteTs = rows[0].updated_at;
    // Синхронизируем ТОЛЬКО если remote новее нашего последнего сохранения
    if (remoteTs && remoteTs !== sbLastKnownUpdatedAt) {
      console.log('TaskFlow: обнаружено обновление на другом устройстве, синхронизируем...');
      await sbSyncFromRemote();
    }
  } catch(e) {}
}

// Загружает актуальные данные из БД, не трогая несохранённые изменения
async function sbSyncFromRemote() {
  try {
    const r = await fetch(`${SB_URL}/taskflow_state?key=eq.${SB_ROW_KEY}&select=data,updated_at`, {
      headers: { ...SB_HEADERS, 'Accept': 'application/json' }
    });
    if (!r.ok) return;
    const rows = await r.json();
    if (!rows || !rows.length || !rows[0].data) return;
    const loaded = rows[0].data;
    S.folders = loaded.folders || [];
    S.topics  = loaded.topics  || [];
    sbLastKnownUpdatedAt = rows[0].updated_at;
    render();
    showToast('🔄 Данные синхронизированы с другого устройства');
  } catch(e) {
    console.error('sbSyncFromRemote error:', e);
  }
}

async function sbCreateTable() {
  showToast('⚠ Таблица не найдена. Создайте её в Supabase (см. консоль).', 6000);
  console.warn(
    'TaskFlow: создайте таблицу в Supabase SQL Editor:\n\n' +
    'CREATE TABLE taskflow_state (\n' +
    '  key TEXT PRIMARY KEY,\n' +
    '  data JSONB,\n' +
    '  updated_at TIMESTAMPTZ DEFAULT now()\n' +
    ');\n' +
    'ALTER TABLE taskflow_state ENABLE ROW LEVEL SECURITY;\n' +
    'CREATE POLICY "Allow all" ON taskflow_state FOR ALL USING (true) WITH CHECK (true);'
  );
}

async function sbSave() {
  try {
    const now = new Date().toISOString();
    const payload = { key: SB_ROW_KEY, data: { folders: S.folders, topics: S.topics }, updated_at: now };
    const r = await fetch(`${SB_URL}/taskflow_state`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(payload)
    });
    if (!r.ok) {
      const err = await r.json().catch(()=>({}));
      if (r.status === 404 || (err.code && err.code === '42P01')) {
        await sbCreateTable(); return;
      }
      throw new Error(err.message || r.statusText);
    }
    sbLastKnownUpdatedAt = now; // запоминаем метку времени нашего сохранения
    showToast('✓ Сохранено');
  } catch(e) {
    console.error('sbSave error:', e);
    showToast('⚠ Ошибка сохранения: ' + e.message, 4000);
  }
}

// Debounced auto-save after any state change
function scheduleSave() {
  clearTimeout(sbSaveTimer);
  sbSaveTimer = setTimeout(async () => {
    sbSaveTimer = null;
    await sbSave();
  }, 600);
}

// При возвращении на вкладку — сразу проверяем актуальность данных
document.addEventListener('visibilitychange', () => {

    sbPollForUpdates();

});

// ── Toast notification ─────────────────────────────
function showToast(msg, duration=2000) {
  let t = document.getElementById('sb-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'sb-toast';
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#27272c;border:1px solid #45454e;color:#e8e8ea;padding:8px 18px;border-radius:8px;font-size:13px;z-index:9999;pointer-events:none;transition:opacity .3s;font-family:inherit';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, duration);
}

let S={folders:[],topics:[]};
let view='home', curTopicId=null, curDetail=null, curDeadlineFilter=null;
let selIds=new Set(), modalCb=null, confirmCb=null, ctxId=null, ctxOpen=false;
let dragState=null; // for subtask drag-reorder

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const getVal=id=>{let e=document.getElementById(id);return e?e.value.trim():'';};
const fmtDate=d=>{if(!d)return'';return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});};

function findTaskObj(taskId,subId){
  let topic=S.topics.find(x=>x.id===curTopicId); if(!topic)return null;
  let sub=topic.subtopics.find(x=>x.id===subId);  if(!sub)return null;
  return sub.tasks.find(x=>x.id===taskId)||null;
}

// ── Get all tasks with deadlines ──────────────────
function getAllTasksWithDeadlines(){
  let tasks=[];
  S.topics.forEach(topic=>{
    topic.subtopics.forEach(sub=>{
      sub.tasks.forEach(task=>{
        if(task.deadline && !task.done){
          let folder=topic.folderId?S.folders.find(f=>f.id===topic.folderId):null;
          tasks.push({
            task,
            topicId:topic.id,
            topicName:topic.name,
            subId:sub.id,
            subName:sub.name,
            folderName:folder?folder.name:null
          });
        }
      });
    });
  });
  return tasks;
}

function filterTasksByDays(tasks,days){
  const now=new Date();
  now.setHours(0,0,0,0);
  const end=new Date(now);
  end.setDate(end.getDate()+days);
  
  return tasks.filter(t=>{
    const dl=new Date(t.task.deadline);
    dl.setHours(0,0,0,0);
    return dl>=now && dl<=end;
  }).sort((a,b)=>new Date(a.task.deadline)-new Date(b.task.deadline));
}

function renderDeadlineView(){
  let title='';
  let days=0;
  if(curDeadlineFilter==='today'){title='Сегодня';days=0;}
  else if(curDeadlineFilter==='week7'){title='Следующие 7 дней';days=7;}
  else if(curDeadlineFilter==='month30'){title='Следующие 30 дней';days=30;}
  
  document.getElementById('dv-title').textContent=title;
  
  const allTasks=getAllTasksWithDeadlines();
  const filtered=filterTasksByDays(allTasks,days);
  
  if(!filtered.length){
    document.getElementById('deadline-tasks-list').innerHTML=`
      <div class="empty-state">
        <div class="empty-state-icon">✓</div>
        <div class="empty-state-text">Нет задач с дедлайнами в этом периоде</div>
      </div>`;
    return;
  }
  
  let h='';
  filtered.forEach(item=>{
    const now=new Date();now.setHours(0,0,0,0);
    const dl=new Date(item.task.deadline);dl.setHours(0,0,0,0);
    const diff=Math.floor((dl-now)/86400000);
    const ov=diff<0;
    const soon=!ov&&diff<=2;
    const dateClass=ov?'ov':(soon?'soon':'');
    
    const isAct=curDetail&&curDetail.taskId===item.task.id;
    
    h+=`<div class="deadline-task-card ${isAct?'active-detail':''}" onclick="openDetailFromDeadline('${item.task.id}','${item.subId}','${item.topicId}')">
      <div class="dtc-main">

        <div class="dtc-path">
          ${item.folderName?`📁 ${esc(item.folderName)} <span style="opacity:.35">›</span> `:''}
          ${esc(item.topicName)} <span style="opacity:.35">›</span> ${esc(item.subName)}
        </div>
      </div>
      <div class="dtc-date ${dateClass}">${fmtDate(item.task.deadline)}</div>
    </div>`;
  });
  
  document.getElementById('deadline-tasks-list').innerHTML=h;
}

    `<label>Тема</label><select id="m-topic">${topicOpts}</select>
     <label>Подтема</label><select id="m-sub"></select>
     <label>Название</label><input id="m0" placeholder="Что нужно сделать?">
     <label>Описание</label><textarea id="m1" placeholder="Подробности..."></textarea>
     <label>Дедлайн</label><input type="date" id="m2">`,
    ()=>{
      const topicId=document.getElementById('m-topic').value;
      const subId=document.getElementById('m-sub').value;
      const name=getVal('m0');if(!name)return;
      
      const topic=S.topics.find(t=>t.id===topicId);
      if(!topic)return;
      const sub=topic.subtopics.find(s=>s.id===subId);
      if(!sub)return;
      
      sub.tasks.push({id:uid(),name,desc:getVal('m1'),deadline:getVal('m2'),done:false,subtasks:[]});
      render();
    });
  
  // Update subtopics when topic changes
  setTimeout(()=>{
    const topicSel=document.getElementById('m-topic');
    const subSel=document.getElementById('m-sub');
    
    function updateSubs(){
      const topicId=topicSel.value;
      const topic=S.topics.find(t=>t.id===topicId);
      if(!topic)return;
      subSel.innerHTML=topic.subtopics.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
    }
    
    topicSel.addEventListener('change',updateSubs);
    updateSubs();
  },50);
}

// ── Detail panel ───────────────────────────────────
function openDetail(taskId,subId){
  curDetail={taskId,subId};
  document.getElementById('detail-panel').classList.add('show');
  renderDetailPanel(taskId,subId);
  document.querySelectorAll('.task-card, .deadline-task-card').forEach(c=>c.classList.remove('active-detail'));
  document.querySelectorAll('.task-card, .deadline-task-card').forEach(c=>{
    if(c.getAttribute('onclick')&&c.getAttribute('onclick').includes(taskId))c.classList.add('active-detail');
  });
}

function renderDetailPanel(taskId,subId){
  let topic=S.topics.find(x=>x.id===curTopicId);if(!topic)return;
  let sub=topic.subtopics.find(x=>x.id===subId);if(!sub)return;
  let task=sub.tasks.find(x=>x.id===taskId);if(!task)return;
  if(!task.subtasks)task.subtasks=[];

  let folder=topic.folderId?S.folders.find(f=>f.id===topic.folderId):null;
  let ov=task.deadline&&!task.done&&new Date(task.deadline)<new Date();
  let soon=task.deadline&&!task.done&&!ov&&(new Date(task.deadline)-new Date())<3*86400000;
  let bc=ov?'ov':(soon?'soon':'ok'), bt=ov?'Просрочено':(soon?'Скоро':'В срок');

  let stTotal=task.subtasks.length, stDone=task.subtasks.filter(x=>x.done).length;
  let pct=stTotal?Math.round(stDone/stTotal*100):0;

  // subtask rows
  let stRows='';
  task.subtasks.forEach((st,idx)=>{
    stRows+=`<div class="st-row ${st.done?'done':''}"
      id="str-${st.id}"
      data-stid="${st.id}"
      data-taskid="${taskId}"
      data-subid="${subId}"
      draggable="true"
      ondragstart="stDragStart(event,'${taskId}','${subId}','${st.id}')"
      ondragover="stDragOver(event,'${taskId}','${subId}','${st.id}')"
      ondragleave="stDragLeave(event)"
      ondrop="stDrop(event,'${taskId}','${subId}','${st.id}')"
      ondragend="stDragEnd(event)">
      <span class="st-drag" title="Перетащить">⠿</span>
      <div class="st-chk" onclick="toggleSubtask('${taskId}','${subId}','${st.id}')">✓</div>
      <span class="st-name" id="stn-${st.id}">${esc(st.name)}</span>
      <div class="st-acts">
        <button class="ico-btn" title="Редактировать" onclick="editSubtaskInline('${taskId}','${subId}','${st.id}')">✎</button>
        <button class="ico-btn del" title="Удалить" onclick="deleteSubtask('${taskId}','${subId}','${st.id}')">✕</button>
      </div>
    </div>`;
  });

  document.getElementById('dp-body').innerHTML=`
    <div class="dp-path">
      ${folder?`📁 ${esc(folder.name)} <span style="opacity:.35">›</span> `:''}
      ${esc(topic.name)} <span style="opacity:.35">›</span> ${esc(sub.name)}
    </div>
    <div class="dp-title">${esc(task.name)}</div>

    ${task.deadline?`<div class="dp-lbl">Дедлайн</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="dp-val">${fmtDate(task.deadline)}</div>
      <div class="dp-badge ${bc}">${bt}</div>
    </div>`:''}

    ${task.desc?`<div class="dp-lbl">Описание</div><div class="dp-desc">${esc(task.desc)}</div>`:''}

    <div class="dp-lbl">Статус</div>
    <div class="dp-val">${task.done?'✓ Выполнено':'○ Не выполнено'}</div>

    <div class="st-section">
      <div class="st-section-hd">
        <span class="st-section-lbl">Подзадачи</span>
        ${stTotal?`<span class="st-section-cnt">${stDone} из ${stTotal} · ${pct}%</span>`:''}
      </div>
      ${stTotal?`<div class="st-progbar"><div class="st-progbar-fill" style="width:${pct}%"></div></div>`:''}
      <div class="st-list" id="st-list-${taskId}">${stRows}</div>
      <div class="st-add-area">
        <div class="add-st-row" id="add-st-row-${taskId}">
          <div class="st-chk" style="cursor:default;opacity:.3">✓</div>
          <input id="add-st-inp-${taskId}" placeholder="Новая подзадача..."
            onkeydown="if(event.key==='Enter')confirmAddSubtask('${taskId}','${subId}');if(event.key==='Escape')cancelAddSubtask('${taskId}')">
          <button class="ico-btn" onclick="confirmAddSubtask('${taskId}','${subId}')" title="Добавить">↵</button>
          <button class="ico-btn del" onclick="cancelAddSubtask('${taskId}')" title="Отмена" style="font-size:11px">✕</button>
        </div>
        <button class="add-st-btn" id="add-st-btn-${taskId}" onclick="showAddSubtask('${taskId}')">
          <span style="font-size:14px;line-height:1">+</span> Добавить подзадачу
        </button>
      </div>
    </div>

    <div class="dp-actions">
      <button class="btn sm" onclick="editTask('${task.id}','${subId}')">✎ Изменить задачу</button>
      <button class="btn sm danger" onclick="deleteTask('${task.id}','${subId}')">✕ Удалить</button>
    </div>`;
}

function closeDetail(){
  document.getElementById('detail-panel').classList.remove('show');
  document.querySelectorAll('.task-card, .deadline-task-card').forEach(c=>c.classList.remove('active-detail'));
  curDetail=null;

// ── Subtask: Add ───────────────────────────────────
function showAddSubtask(taskId){
  document.getElementById('add-st-btn-'+taskId).style.display='none';
  let row=document.getElementById('add-st-row-'+taskId);
  row.classList.add('show');
  setTimeout(()=>document.getElementById('add-st-inp-'+taskId).focus(),20);
}
function cancelAddSubtask(taskId){
  let row=document.getElementById('add-st-row-'+taskId);
  if(row)row.classList.remove('show');
  let btn=document.getElementById('add-st-btn-'+taskId);
  if(btn)btn.style.display='';
  let inp=document.getElementById('add-st-inp-'+taskId);
  if(inp)inp.value='';
}
function confirmAddSubtask(taskId,subId){
  let inp=document.getElementById('add-st-inp-'+taskId);
  if(!inp)return;
  let v=inp.value.trim();
  if(!v){cancelAddSubtask(taskId);return;}
  let task=findTaskObj(taskId,subId);if(!task)return;
  if(!task.subtasks)task.subtasks=[];
  task.subtasks.push({id:uid(),name:v,done:false});
  scheduleSave(); 
  renderDetailPanel(taskId,subId);
  if(view==='topic')renderTopic();
  if(view==='deadline')renderDeadlineView();
  showAddSubtask(taskId);
}

// ── Subtask: Toggle ────────────────────────────────
function toggleSubtask(taskId,subId,stId){
  let task=findTaskObj(taskId,subId);if(!task||!task.subtasks)return;
  let st=task.subtasks.find(x=>x.id===stId);
  if(st)st.done=!st.done;
  scheduleSave();
  renderDetailPanel(taskId,subId);
  if(view==='topic')renderTopic();
  if(view==='deadline')renderDeadlineView();
  showAddSubtask(taskId);
}

// ── Subtask: Inline Edit ───────────────────────────
function editSubtaskInline(taskId,subId,stId){
  let task=findTaskObj(taskId,subId);if(!task||!task.subtasks)return;
  let st=task.subtasks.find(x=>x.id===stId);if(!st)return;
  let nameEl=document.getElementById('stn-'+stId);if(!nameEl)return;

  let row=document.getElementById('str-'+stId);
  if(row)row.classList.add('editing');

  let inp=document.createElement('input');
  inp.className='st-edit-inp';
  inp.value=st.name;
  inp.setAttribute('data-editing','1');
  nameEl.replaceWith(inp);
  inp.focus();
  inp.setSelectionRange(inp.value.length,inp.value.length);

  let committed=false;
  function commit(){
    if(committed)return; committed=true;
    let v=inp.value.trim();
    if(v)st.name=v;
    scheduleSave();
    renderDetailPanel(taskId,subId);
    if(view==='topic')renderTopic();
    if(view==='deadline')renderDeadlineView();
  }
  function cancel(){
    if(committed)return; committed=true;
    renderDetailPanel(taskId,subId);
  }

  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();inp.removeEventListener('blur',commit);commit();}
    if(e.key==='Escape'){e.preventDefault();inp.removeEventListener('blur',commit);cancel();}
    e.stopPropagation();
  });
}

// ── Subtask: Delete ────────────────────────────────
function deleteSubtask(taskId,subId,stId){
  let task=findTaskObj(taskId,subId);if(!task||!task.subtasks)return;
  let st=task.subtasks.find(x=>x.id===stId);if(!st)return;
  openConfirm('Удалить подзадачу',`Удалить «${st.name}»?`,'Удалить',(ok)=>{
    if(!ok)return;
    task.subtasks=task.subtasks.filter(x=>x.id!==stId);
    scheduleSave();
    renderDetailPanel(taskId,subId);
    if(view==='topic')renderTopic();
    if(view==='deadline')renderDeadlineView();
  });
}

// ── Subtask: Drag-to-reorder ───────────────────────
function stDragStart(e,taskId,subId,stId){
  dragState={taskId,subId,stId};
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',stId);
  let row=document.getElementById('str-'+stId);
  if(row)setTimeout(()=>row.classList.add('dragging'),0);
}
function stDragOver(e,taskId,subId,stId){
  if(!dragState||dragState.stId===stId)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.st-row').forEach(r=>r.classList.remove('st-drop-target'));
  let row=document.getElementById('str-'+stId);
  if(row)row.classList.add('st-drop-target');
}
function stDragLeave(e){
  let t=e.currentTarget;if(t)t.classList.remove('st-drop-target');
}
function stDrop(e,taskId,subId,targetStId){
  e.preventDefault();
  if(!dragState||dragState.stId===targetStId)return;
  let task=findTaskObj(taskId,subId);if(!task||!task.subtasks)return;
  let fromIdx=task.subtasks.findIndex(x=>x.id===dragState.stId);
  let toIdx=task.subtasks.findIndex(x=>x.id===targetStId);
  if(fromIdx<0||toIdx<0)return;
  let [moved]=task.subtasks.splice(fromIdx,1);
  task.subtasks.splice(toIdx,0,moved);
  scheduleSave();
  stDragEnd(e);
  renderDetailPanel(taskId,subId);
}
function stDragEnd(e){
  document.querySelectorAll('.st-row').forEach(r=>{
    r.classList.remove('dragging','st-drop-target');
  });
  dragState=null;
}

// ── Subtopics (columns) ────────────────────────────

    ()=>{
      let v=getVal('m0');if(!v)return;

function editSubName(sid){
  let t=S.topics.find(x=>x.id===curTopicId);if(!t)return;
  let s=t.subtopics.find(x=>x.id===sid);if(!s)return;
  let el=document.getElementById('sn-'+sid);if(!el)return;
  let inp=document.createElement('input');
  inp.className='sub-hd-name';inp.id='sn-'+sid;inp.value=s.name;
  el.replaceWith(inp);inp.focus();inp.select();
  inp.addEventListener('blur',()=>saveSubName(sid,inp.value));
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter')inp.blur();

function saveSubName(sid,v){

  let t=S.topics.find(x=>x.id===curTopicId);if(!t)return;
  let s=t.subtopics.find(x=>x.id===sid);if(s&&v)s.name=v;

function deleteSub(sid){

     <label>Описание</label><textarea id="m1" placeholder="Подробности..."></textarea>
     <label>Дедлайн</label><input type="date" id="m2">`,

function toggleDone(taskId,subId){

  let s=t.subtopics.find(x=>x.id===subId);if(!s)return;

      render();
    });

function deleteTask(taskId,subId){

    if(!ok)return;
    let t=S.topics.find(x=>x.id===curTopicId);if(!t)return;
    let s=t.subtopics.find(x=>x.id===subId);if(!s)return;
    s.tasks=s.tasks.filter(x=>x.id!==taskId);
    closeDetail();render();
  });
}

// ── Modal ──────────────────────────────────────────
function openModal(title,body,cb){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  modalCb=cb;
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(()=>{let el=document.querySelector('#modal-body input,#modal-body textarea');if(el)el.focus();},40);
  document.querySelectorAll('#modal-body input').forEach(el=>{
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA')confirmModal();});
  });
}
function closeModal(){document.getElementById('modal-bg').classList.remove('show');modalCb=null;}
function confirmModal(){if(modalCb)modalCb();closeModal();}
document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('confirm-bg').addEventListener('click',function(e){if(e.target===this)closeConfirm(false);});

// ── Keyboard ───────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.getElementById('confirm-bg').classList.contains('show')){closeConfirm(false);return;}
  if(document.getElementById('modal-bg').classList.contains('show')){closeModal();return;}
  if(ctxOpen){closeCtx();return;}
  if(curDetail){closeDetail();return;}
  if(selIds.size){clearSel();return;}
  if(view==='topic'||view==='deadline'){goHome();return;}
});

initDemo();
</script>
